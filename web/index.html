  <title>Pomodoro Pro</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0A0B18;
      overflow: hidden;
    }

    /* ===== Premium splash ===== */
    :root {
      --sp-ink: #E9EBFA;
      --sp-muted: #8E93C4;
      --sp-c1: #6C63FF;
      --sp-c2: #A78BFA;
      --sp-c3: #22D3EE;
      --sp-bg1: #141736;
      --sp-bg2: #0A0B18;
    }

    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background:
        radial-gradient(120% 90% at 50% 8%, rgba(108,99,255,.20) 0%, rgba(108,99,255,0) 55%),
        radial-gradient(90% 70% at 85% 92%, rgba(34,211,238,.13) 0%, rgba(34,211,238,0) 60%),
        linear-gradient(180deg, var(--sp-bg1) 0%, var(--sp-bg2) 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      transition: opacity .5s cubic-bezier(.4,0,.2,1), visibility .5s;
      overflow: hidden;
    }
    #app-splash.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* soft animated aurora glow behind the mark */
    .sp-aura {
      position: absolute;
      width: 46vmin;
      height: 46vmin;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(108,99,255,.55) 0%, rgba(108,99,255,0) 62%);
      filter: blur(6px);
      animation: sp-breathe 4.5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes sp-breathe {
      0%,100% { transform: scale(.86); opacity: .55; }
      50%     { transform: scale(1.06); opacity: .9; }
    }

    .sp-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      padding: 24px;
    }

    /* gradient progress ring with logo inside */
    .sp-ring {
      position: relative;
      width: 148px;
      height: 148px;
      display: grid;
      place-items: center;
    }
    .sp-ring svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      overflow: visible;
    }
    .sp-ring circle {
      fill: none;
      stroke-linecap: round;
    }
    .sp-track {
      stroke: rgba(255,255,255,.10);
      stroke-width: 9;
    }
    .sp-arc {
      stroke: url(#spGrad);
      stroke-width: 9;
      stroke-dasharray: 408;      /* 2πr, r=65 */
      stroke-dashoffset: 408;
      transition: stroke-dashoffset .35s cubic-bezier(.33,1,.68,1);
      filter: drop-shadow(0 0 8px rgba(108,99,255,.55));
    }
    .sp-logo {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      object-fit: cover;
      box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.10);
      animation: sp-pop .7s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes sp-pop {
      from { transform: scale(.6); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .sp-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }
    .sp-title {
      color: var(--sp-ink);
      font-size: 30px;
      font-weight: 800;
      letter-spacing: .5px;
      line-height: 1.15;
      background: linear-gradient(92deg, #fff 10%, #C7CBFF 55%, #9FE9FF 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: sp-rise .7s .08s cubic-bezier(.22,1,.36,1) both;
    }
    .sp-sub {
      color: var(--sp-muted);
      font-size: 14.5px;
      letter-spacing: .3px;
      animation: sp-rise .7s .18s cubic-bezier(.22,1,.36,1) both;
    }
    .sp-dots { display: inline-flex; gap: 6px; margin-inline-start: 8px; vertical-align: middle; }
    .sp-dots i {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--sp-c1);
      animation: sp-dot 1.2s infinite ease-in-out;
    }
    .sp-dots i:nth-child(2) { background: var(--sp-c2); animation-delay: .16s; }
    .sp-dots i:nth-child(3) { background: var(--sp-c3); animation-delay: .32s; }
    @keyframes sp-dot {
      0%,80%,100% { transform: translateY(0); opacity: .35; }
      40% { transform: translateY(-5px); opacity: 1; }
    }
    @keyframes sp-rise {
      from { transform: translateY(14px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    /* slim determinate progress bar */
    .sp-bar {
      width: 168px;
      height: 4px;
      border-radius: 99px;
      background: rgba(255,255,255,.10);
      overflow: hidden;
      animation: sp-rise .7s .26s cubic-bezier(.22,1,.36,1) both;
    }
    .sp-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--sp-c1), var(--sp-c2) 50%, var(--sp-c3));
      box-shadow: 0 0 12px rgba(108,99,255,.65);
      transition: width .35s cubic-bezier(.33,1,.68,1);
    }

    @media (max-width: 420px) {
      .sp-title { font-size: 25px; }
      .sp-ring { width: 124px; height: 124px; }
      .sp-logo { width: 52px; height: 52px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sp-aura, .sp-logo, .sp-title, .sp-sub, .sp-bar, .sp-dots i { animation: none !important; }
      .sp-logo, .sp-title, .sp-sub, .sp-bar { opacity: 1; transform: none; }
      .sp-dots i { opacity: .8; }
    }
  </style>
</head>
<body>
  <div id="app-splash" role="status" aria-live="polite">
    <div class="sp-aura" aria-hidden="true"></div>
    <div class="sp-stage">
      <div class="sp-ring">
        <svg viewBox="0 0 148 148" aria-hidden="true">
          <defs>
            <linearGradient id="spGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#6C63FF"/>
              <stop offset="55%" stop-color="#A78BFA"/>
              <stop offset="100%" stop-color="#22D3EE"/>
            </linearGradient>
          </defs>
          <circle class="sp-track" cx="74" cy="74" r="65"/>
          <circle class="sp-arc" id="spArc" cx="74" cy="74" r="65"/>
        </svg>
        <img class="sp-logo" src="icons/Icon-192.png" alt="">
      </div>
      <div class="sp-brand">
        <div class="sp-title">Pomodoro Pro</div>
        <div class="sp-sub">
          جارٍ التحميل<span class="sp-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
      </div>
      <div class="sp-bar" aria-hidden="true"><div class="sp-bar-fill" id="spBar"></div></div>
    </div>
  </div>

  <script>
    (function () {
      var CIRC = 2 * Math.PI * 65; // r=65 -> ~408.4
      var arc = document.getElementById('spArc');
      var bar = document.getElementById('spBar');
      var shown = 0;

      function setProgress(pct) {
        pct = Math.max(0, Math.min(100, pct));
        if (pct <= shown) { return; }
        shown = pct;
        if (arc) { arc.style.strokeDashoffset = String(CIRC * (1 - pct / 100)); }
        if (bar) { bar.style.width = pct + '%'; }
      }

      // Creep toward 90% while the engine boots so the bar feels alive,
      // then complete it on first frame.
      var creep = setInterval(function () {
        setProgress(Math.min(90, shown + Math.max(0.6, (90 - shown) * 0.06)));
      }, 120);

      function dismiss() {
        setProgress(100);
        var splash = document.getElementById('app-splash');
        if (splash && !splash.classList.contains('is-hidden')) {
          splash.classList.add('is-hidden');
          setTimeout(function () { splash.remove(); }, 600);
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js').catch(function () {});
        }
        clearInterval(creep);
      }

      window.addEventListener('flutter-first-frame', dismiss);
      // Safety net: never leave the user stuck on the splash screen.
      setTimeout(dismiss, 9000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
